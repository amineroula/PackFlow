name: Build PackFlow for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - v0.1

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PackFlow executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name PackFlow --add-data "assets;assets" --collect-all PySide6 --collect-all reportlab --collect-all PIL main.py

      - name: Upload PackFlow Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PackFlow-Windows
          path: dist/PackFlow/
          if-no-files-found: error
          retention-days: 14
